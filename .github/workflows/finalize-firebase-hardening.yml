name: Finalize Firebase hardening track

on:
  push:
    branches:
      - feat/firebase-production-niyet

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/firebase-production-niyet
      - run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Apply compatibility and capacity parity changes
        run: |
          python scripts/_finalize_firebase_track.py
          git diff --check
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e . pytest
          npm install --global firebase-tools
      - name: Validate regular suite and contest extension
        run: |
          python -m compileall -q src api scripts experiments
          node --check demo/nsosyal-overlay/background.js
          node --check demo/nsosyal-overlay/content-v2.js
          python scripts/build_site.py
          python scripts/package_nsosyal_overlay.py
          pytest -q
      - name: Validate Firestore emulator without skips
        run: firebase emulators:exec --only firestore --project drsk-web-test "python -m pytest -q tests/test_firestore_emulator.py"
      - name: Commit verified hardening changes and remove temporary automation
        run: |
          rm -f scripts/_finalize_firebase_track.py .github/workflows/finalize-firebase-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(firebase): isolate backend track and preserve NIYET capacity semantics"
          git push origin HEAD:feat/firebase-production-niyet
