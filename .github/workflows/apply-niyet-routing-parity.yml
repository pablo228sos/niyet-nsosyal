name: Apply NIYET routing parity

on:
  push:
    branches:
      - feat/firebase-production-niyet
    paths:
      - 'scripts/_apply_niyet_routing_parity.py'
      - '.github/workflows/apply-niyet-routing-parity.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/firebase-production-niyet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply production routing parity changes
        run: |
          python scripts/_apply_niyet_routing_parity.py
          git diff --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e . pytest

      - name: Validate NIYET production routing
        run: |
          python -m pytest -q tests/test_niyet_production_routing.py tests/test_niyet_persistence.py tests/test_niyet_capacity_lifecycle.py tests/test_niyet_api.py
          python -m compileall -q src api scripts
          node --check web/live.js
          node --check web/firebase-client.js
          git diff --check

      - name: Commit verified production routing and remove temporary automation
        run: |
          rm -f scripts/_apply_niyet_routing_parity.py
          rm -f .github/workflows/apply-niyet-routing-parity.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(niyet): preserve intent willingness and global allocation'
          git push origin HEAD:feat/firebase-production-niyet
