name: sourcechain-modernbert-eval

on:
  push:
    branches:
      - experiment/sourcechain-modernbert-ranking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and semantic evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .
          pip install 'sentence-transformers>=5,<6'

      - name: Evaluate lexical, ModernBERT embedder and reranker
        run: |
          python experiments/evaluate_sourcechain_modernbert.py --semantic --reranker | tee sourcechain_modernbert_results.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sourcechain-modernbert-results
          path: sourcechain_modernbert_results.json
          if-no-files-found: warn
          retention-days: 7
