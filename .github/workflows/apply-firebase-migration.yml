name: Apply Firebase production migration

on:
  push:
    branches:
      - feat/firebase-production-niyet
    paths:
      - '.github/migration/**'
      - '.github/workflows/apply-firebase-migration.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/firebase-production-niyet

      - name: Reassemble audited migration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/migration/migration.part* > /tmp/firebase-migration.patch.gz
          gzip -t /tmp/firebase-migration.patch.gz
          gzip -dc /tmp/firebase-migration.patch.gz > /tmp/firebase-migration.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/firebase-migration.patch')
          # The patch was exported by Windows PowerShell after Git's UTF-8 bytes
          # were decoded through the OEM CP866 code page. Reverse that transport
          # encoding exactly before applying it to the UTF-8 repository files.
          mojibake = path.read_text(encoding='utf-8')
          path.write_text(mojibake.encode('cp866').decode('utf-8'), encoding='utf-8')
          PY
          gzip -t .github/migration/refinements.patch.gz
          gzip -dc .github/migration/refinements.patch.gz > /tmp/refinements.patch
          git apply --check /tmp/firebase-migration.patch
          git apply /tmp/firebase-migration.patch
          git apply --check /tmp/refinements.patch
          git apply /tmp/refinements.patch
          python - <<'PY'
          from pathlib import Path
          # The exported patch created an extra blank EOF line in three new files.
          # Normalize only those known files before the staged whitespace gate.
          for name in (
              'firebase.json',
              'src/drsk/firebase_auth.py',
              'tests/test_firebase_auth.py',
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Secret safety gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = {
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'google_api_key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              'github_token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
              'aws_access_key': re.compile(r'AKIA[0-9A-Z]{16}'),
          }
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github/migration' in str(path):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for name, rx in patterns.items():
                  if rx.search(text):
                      hits.append((name, str(path)))
          if hits:
              for name, path in hits:
                  print(f'Potential secret: {name} in {path}')
              sys.exit(1)
          print('Secret safety gate: clean')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e . pytest

      - name: Production migration validation
        shell: bash
        run: |
          set -euo pipefail
          node --check web/live.js
          node --check web/firebase-client.js
          python scripts/build_site.py
          python -m compileall -q src api scripts experiments
          pytest -q
          git diff --check

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/migration
          rm -f .github/workflows/apply-firebase-migration.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(niyet): migrate production state to Firebase multi-user backend'
          git push origin HEAD:feat/firebase-production-niyet
