name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: node --check web/app.js
      - run: node --check web/lab.js
      - run: node --check web/live.js
      - run: node --check web/live-motion.js
      - run: node --check web/live-theme.js
      - run: node --check demo/nsosyal-overlay/background.js
      - run: node --check demo/nsosyal-overlay/content.js
      - run: python scripts/build_site.py
      - run: python scripts/package_nsosyal_overlay.py
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints.txt -e . pytest
      - run: python -m compileall -q src api scripts experiments
      - run: pytest -q
      - run: python experiments/evaluate_matching_draft.py
      - run: python experiments/evaluate_sourcechain_v0.py
      - run: python scripts/validate_annotations.py data/intent_seed_v1.csv
      - run: python scripts/validate_annotations.py data/response_gate_seed_v1.csv
      - run: python scripts/validate_sourcebench.py data/sourcebench_tr
      - uses: actions/upload-artifact@v4
        with:
          name: drsk-nsosyal-overlay-${{ github.sha }}
          path: dist/drsk-nsosyal-overlay.zip
          if-no-files-found: error
          retention-days: 7
