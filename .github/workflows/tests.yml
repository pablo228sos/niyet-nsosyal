name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[embeddings]' pytest
      - run: pytest -q
      - run: python experiments/evaluate_matching_draft.py
      - run: python experiments/evaluate_modernbert_retrieval.py
