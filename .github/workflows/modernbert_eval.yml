name: modernbert retrieval evaluation

on:
  push:
    branches:
      - modernbert-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[embeddings]'
      - run: python experiments/evaluate_modernbert_retrieval.py
