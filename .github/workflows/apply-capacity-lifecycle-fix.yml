name: Apply capacity lifecycle fix

on:
  push:
    branches:
      - feat/firebase-production-niyet
    paths:
      - 'scripts/_apply_capacity_lifecycle_fix.py'
      - '.github/workflows/apply-capacity-lifecycle-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/firebase-production-niyet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply production capacity lifecycle fix
        run: |
          python scripts/_apply_capacity_lifecycle_fix.py
          git diff --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e . pytest

      - name: Validate production invariants
        run: |
          python -m pytest -q tests/test_niyet_persistence.py tests/test_niyet_api.py tests/test_firebase_backend.py tests/test_firebase_auth.py
          node --check web/live.js
          node --check web/firebase-client.js
          python scripts/build_site.py
          python -m compileall -q src api scripts
          git diff --check

      - name: Commit verified fix and remove temporary automation
        run: |
          rm -f .github/migration/capacity-lifecycle.patch
          rm -f scripts/_apply_capacity_lifecycle_fix.py
          rm -f .github/workflows/apply-capacity-lifecycle-fix.yml
          rmdir .github/migration 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(niyet): restore responder capacity after resolution'
          git push origin HEAD:feat/firebase-production-niyet
