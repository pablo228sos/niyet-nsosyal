[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niyet"
version = "0.1.0"
description = "Capacity-aware interaction allocation prototype for NSosyal"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
