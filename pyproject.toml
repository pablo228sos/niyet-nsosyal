[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niyet"
version = "0.1.0"
description = "DRSK hybrid social-intelligence prototype: bounded evidence plus capacity-aware human resolution"
requires-python = ">=3.11"
dependencies = [
  "firebase-admin>=6.6,<8",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0,<6"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[project.urls]
Repository = "https://github.com/pablo228sos/niyet-nsosyal"
Demo = "https://niyet-nsosyal.vercel.app/live"
