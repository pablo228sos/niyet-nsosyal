[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niyet"
version = "0.1.0"
description = "Capacity-aware interaction allocation prototype for NSosyal"
requires-python = ">=3.11"
dependencies = ["scipy>=1.11", "scikit-learn>=1.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
